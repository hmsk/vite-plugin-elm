version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      # Held at the oldest Node the plugin supports (^20.19.0 || >=22.12.0).
      # Vitest 5+ requires Node 22.12+.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint doesn't support TypeScript 7 yet
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      acorn:
        patterns:
          - 'acorn*'
      eslint-family:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'eslint-config-prettier'
          - 'prettier'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
