version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      # Held at the oldest Node the plugin supports (>=22.12.0)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Moving to TypeScript 7 is a change of its own
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      acorn:
        patterns:
          - 'acorn*'
      oxc:
        patterns:
          - 'oxlint'
          - 'oxfmt'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
