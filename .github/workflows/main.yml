name: Main CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci

      - name: Run oxlint and oxfmt
        run: npm run lint

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Same as engines.node: Node 20 is EOL, though Vite 6–8 still allow it
        node-version: [22.x, 24.x, 26.x]
        include:
          - os: windows-latest
            node-version: 24.x
          - os: macos-latest
            node-version: 24.x

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` builds the package through the `prepare` script
      - run: npm ci

      - name: Run unit tests
        run: npm run test:ci

  e2e:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        vite: ['6', '7', '8']
        elm: ['0.19.1-6']
        include:
          - vite: '8'
            elm: '0.19.2-0'
          - vite: '8'
            elm: '0.19.3-0'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci

      - name: Install the example with Vite ${{ matrix.vite }} and Elm ${{ matrix.elm }}
        working-directory: example
        env:
          ELM: ${{ matrix.elm }}
        run: |
          npm ci
          npm install --no-save vite@${{ matrix.vite }} elm@$ELM
          # elm.json has to name the version of the compiler, e.g. 0.19.3 for elm@0.19.3-0
          node -e "const fs = require('fs'); const json = JSON.parse(fs.readFileSync('elm.json', 'utf8')); json['elm-version'] = process.env.ELM.split('-')[0]; fs.writeFileSync('elm.json', JSON.stringify(json, null, 4) + '\\n')"
          npx vite --version
          npx elm --version

      # The example links this plugin, which imports vite from the repository's node_modules,
      # so the plugin also runs on the Vite under test, as it does in a project.
      # After installing the example, which builds the plugin with the types of Vite 8
      - name: Use Vite ${{ matrix.vite }} for the plugin
        run: |
          npm install --no-save vite@${{ matrix.vite }}
          node -p "'vite ' + require('vite/package.json').version"

      # The runner image already has the libraries Chromium needs. --with-deps would only add fonts,
      # and makes the job fail whenever the runner can't reach Ubuntu's package archive
      - name: Install Chromium
        run: npx playwright install --only-shell chromium

      # Builds the plugin, then runs each test file on its own copy of the example
      - name: Run integration tests
        run: npm run test:e2e

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: traces-vite-${{ matrix.vite }}-elm-${{ matrix.elm }}
          path: test-results
          retention-days: 7
