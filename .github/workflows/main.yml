name: Main CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Run oxlint and oxfmt
        run: npm run lint

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Same as engines.node, which follows Vite 7+ (20 is EOL but still allowed by Vite)
        node-version: [20.x, 22.x, 24.x, 26.x]
        include:
          - os: windows-latest
            node-version: 24.x
          - os: macos-latest
            node-version: 24.x

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` builds the package through the `prepare` script
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Run unit tests
        run: npm run test:ci

  e2e:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        vite: ['6', '7', '8']
        elm: ['0.19.1-6']
        include:
          - vite: '8'
            elm: '0.19.2-0'
          - vite: '8'
            elm: '0.19.3-0'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci

      - name: Install the example with Vite ${{ matrix.vite }} and Elm ${{ matrix.elm }}
        working-directory: example
        env:
          ELM: ${{ matrix.elm }}
        run: |
          npm ci
          npm install --no-save vite@${{ matrix.vite }} elm@$ELM
          # elm.json has to name the version of the compiler, e.g. 0.19.3 for elm@0.19.3-0
          node -e "const fs = require('fs'); const json = JSON.parse(fs.readFileSync('elm.json', 'utf8')); json['elm-version'] = process.env.ELM.split('-')[0]; fs.writeFileSync('elm.json', JSON.stringify(json, null, 4) + '\\n')"
          npx vite --version
          npx elm --version

      - name: Run integration tests
        uses: cypress-io/github-action@v7
        with:
          install: false
          build: npm run build --prefix example
          start: npm run cypress:prepare
          wait-on: 'http://localhost:8936, http://localhost:8938'

      - name: Make sure we can compile with eol2 via command line
        run: npm run build:example:eol2
